# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "bhop-brethren" branch
  push:
    branches: [ "bhop-brethren" ]
  pull_request:
    branches: [ "bhop-brethren" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    name: SM version ${{ matrix.sm-version }}
    steps:
      - uses: actions/checkout@v1

      - name: Setup SP
        id: setup_sp
        uses: rumblefrog/setup-sp@master
        with:
          version: '1.12.x'

      - run: |
          for FILE in addons/sourcemod/scripting/*.sp;
          do
            fileName="${FILE##*/}"
            base="${fileName%%.*}"
            spcomp "$FILE" -i=addons/sourcemod/scripting/include
          done;
