name: Compile with SourceMod

on:
  pull_request:
    branches: bhop-brethren
  push:
    branches: bhop-brethren

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v3

      - name: Set environment variables
        run: echo SCRIPTS_PATH=$(pwd) >> $GITHUB_ENV
      - name: Setup SourcePawn Compiler ${{ matrix.SM_VERSION }}
        id: setup_sp
        uses: rumblefrog/setup-sp@master
        with:
          version: '1.12.x'

      - name: Compile plugins
        run: |
          mkdir -p ./addons/sourcemod/scripting/include/ripext
          curl -LJO "https://github.com/ErikMinekus/sm-ripext/blob/main/pawn/scripting/include/{ripext.inc,ripext/http.inc,ripext/json.inc}"
          mv ripext.inc ./addons/sourcemod/scripting/include
          mv http.inc json.inc ./addons/sourcemod/scripting/include/ripext
          
          for FILE in ./addons/sourcemod/scripting/*.sp;
          do
            echo -e "\nCompiling $file..."
            spcomp -w234 -O2 -v2 -i ./addons/sourcemod/scripting/include $FILE
          done
          echo "===OUT FILES==="
          ls
        working-directory: ${{ env.SCRIPTS_PATH }}

      - name: Changelog
        id: changelog
        uses: mindsers/changelog-reader-action@v2.0.0

      - name: Install zip
        uses: montudor/action-zip@v1

      - name: Zip output
        run: zip -qq -r release.zip *.smx
        working-directory: ${{ env.SCRIPTS_PATH }}

      - name: Create Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.setup_sp.outputs.plugin-version }}
          artifacts: "release.zip"
          body: ${{ steps.changelog.outputs.changes }}
          draft: false
          allowUpdates: true
          prerelease: false
          replacesArtifacts: true

      - run: |
          curl -O "https://raw.githubusercontent.com/ErikMinekus/sm-ripext/main/pawn/scripting/include/{ripext.inc,ripext/http.inc,ripext/json.inc}"
          mkdir ripext && mv http.inc json.inc ripext
          
          for FILE in addons/sourcemod/scripting/*.sp;
          do
            fileName="${FILE##*/}"
            base="${fileName%%.*}"
            spcomp "$FILE" -i=addons/sourcemod/scripting/include -i./
          done;
