# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "bhop-brethren" branch
  push:
    branches: [ "bhop-brethren" ]
  pull_request:
    branches: [ "bhop-brethren" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sm-version: ['1.12.x']

    # Steps represent a sequence of tasks that will be executed as part of the job
    name: SM version ${{ matrix.sm-version }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup SP
        id: setup_sp
        uses: rumblefrog/setup-sp@master
        with:
          version: ${{ matrix.sm-version }}

      - run: |
          curl -O "https://github.com/ErikMinekus/sm-ripext/blob/main/pawn/scripting/include/{ripext.inc,ripext/http.inc,ripext/json.inc}"
          mkdir ripext && mv http.inc json.inc ripext
          
          for FILE in addons/sourcemod/scripting/*.sp;
          do
            fileName="${FILE##*/}"
            base="${fileName%%.*}"
            spcomp "$FILE" -i=addons/sourcemod/scripting/include -i./
          done;
